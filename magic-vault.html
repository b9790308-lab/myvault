    <script>var startapp_d = "204869829";</script>
    <script src="https://sdk.startapp.com/web/startapp_sdk.js"></script>
    <script>
      window.addEventListener('load', function () {
        function tryInit(attempt) {
          if (window.startapp) {
            // Live mode — real ads, real revenue (App ID: 204869829)
            if (typeof startapp.setAppId    === 'function') startapp.setAppId('204869829');
            if (typeof startapp.onReady     === 'function') startapp.onReady(preloadAd);
            else preloadAd();
          } else if (window.startIO) {
            if (typeof startIO.init === 'function') startIO.init({ appId: '204869829', testMode: true });
            preloadAd();
          } else if (attempt < 20) {
            setTimeout(function () { tryInit(attempt + 1); }, 300);
          }
        }
        function preloadAd() {
          try {
            var api = window.startapp || window.startIO;
            if (!api) return;
            if      (typeof api.preloadInterstitial === 'function') api.preloadInterstitial();
            else if (typeof api.loadInterstitial    === 'function') api.loadInterstitial();
            else if (typeof api.loadAd              === 'function') api.loadAd();
          } catch (e) {}
        }
        tryInit(0);
      });
    </script>
