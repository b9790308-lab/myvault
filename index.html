<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://sdk.start.io/startapp-sdk.js"></script>
    <script type="text/javascript">
        var sdk = new StartAppSDK({ appId: "204869829" });
        function showAd() {
            sdk.showInterstitial();
        }
    </script>
</head>
<body class="bg-black text-yellow-600 flex flex-col items-center justify-center min-h-screen">

    <h1 class="text-3xl font-bold mb-8">Magic Vault</h1>
    <input type="password" id="pin" class="bg-black border border-yellow-600 p-4 text-center text-2xl w-64 mb-6" placeholder="Enter PIN">
    <button onclick="checkPin()" class="bg-yellow-600 text-black font-bold py-3 px-8 text-xl">UNLOCK</button>

    <script>
        function checkPin() {
            var pin = document.getElementById("pin").value;
            if (pin === "222222") {
                showAd(); // Ad trigger
                setTimeout(function() {
                    alert("Vault Unlocked!");
                }, 1000);
            } else {
                alert("Wrong PIN!");
            }
        }
    </script>
</body>
</html>
